[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ni-ai-pipeline"
version = "0.1.0"
description = "Production-ready Bronze→Silver→Gold pipeline and model training for NI_AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "NI_AI" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
train = [
  "scikit-learn>=1.3",
]
mlflow = [
  "mlflow>=2.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
ni-ai-pipeline = "ni_ai_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
