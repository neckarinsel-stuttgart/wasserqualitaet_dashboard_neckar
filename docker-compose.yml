services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
      args:
        PIPELINE_EXTRAS: "api"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./requirements.txt:/app/requirements.txt:ro
      - ./pipeline:/app/pipeline:ro
    environment:
      PYTHONPATH: /app/pipeline/src
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - uvicorn ni_ai_pipeline.api_app:app --host 0.0.0.0 --port 8000

  crawl_dwd:
    build:
      context: .
      dockerfile: docker/Dockerfile.crawler
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    command:
      - python
      - scripts/bronze/crawl_dwd.py

  crawl_lubw:
    build:
      context: .
      dockerfile: docker/Dockerfile.crawler
    env_file:
      - .env
    environment:
      # Set to 0 if you want to watch the browser (requires a GUI-capable runtime)
      LUBW_HEADLESS: "1"
      # Optional tuning
      LUBW_EXPORT_RETRIES: "3"
      LUBW_DOWNLOAD_TIMEOUT_MS: "120000"
      LUBW_RUN_ATTEMPTS: "3"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    command:
      - python
      - scripts/bronze/crawl_lubw.py

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
      args:
        PIPELINE_EXTRAS: "train"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./requirements.txt:/app/requirements.txt:ro
      - ./pipeline:/app/pipeline:ro
    environment:
      PYTHONPATH: /app/pipeline/src
    # Silver + Gold + API-facing weather/prediction refresh (assumes bronze already exists)
    command:
      - ni-ai-pipeline
      - run-api-refresh

  # Read-only data browser (bronze/silver/gold). Reachable only through caddy.
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    volumes:
      - ./data/bronze:/data/bronze:ro
      - ./data/silver:/data/silver:ro
      - ./data/gold:/data/gold:ro
    environment:
      DATA_ROOT: /data
    mem_limit: 350m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 60s

  # Login (and HTTPS once a hostname is set) in front of the dashboard.
  caddy:
    image: caddy:2-alpine
    env_file:
      - path: caddy/private/host.env
        required: false
    depends_on:
      - dashboard
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  caddy_data:
