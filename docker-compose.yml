services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
      args:
        PIPELINE_EXTRAS: "api"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./requirements.txt:/app/requirements.txt:ro
      - ./pipeline:/app/pipeline:ro
    environment:
      PYTHONPATH: /app/pipeline/src
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir -r /app/requirements.txt
        && uvicorn ni_ai_pipeline.api_app:app --host 0.0.0.0 --port 8000

  crawl_dwd:
    build:
      context: .
      dockerfile: docker/Dockerfile.crawler
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./requirements.txt:/app/requirements.txt:ro
      - ./scripts:/app/scripts:ro
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir -r /app/requirements.txt
        && python scripts/bronze/crawl_dwd.py

  crawl_lubw:
    build:
      context: .
      dockerfile: docker/Dockerfile.crawler
    env_file:
      - .env
    environment:
      # Set to 0 if you want to watch the browser (requires a GUI-capable runtime)
      LUBW_HEADLESS: "1"
      # Optional tuning
      LUBW_EXPORT_RETRIES: "3"
      LUBW_DOWNLOAD_TIMEOUT_MS: "120000"
    volumes:
      - ./data:/app/data
      - ./requirements.txt:/app/requirements.txt:ro
      - ./scripts:/app/scripts:ro
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir -r /app/requirements.txt
        && python -m playwright install chromium
        && python scripts/bronze/crawl_lubw.py

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.pipeline
      args:
        PIPELINE_EXTRAS: "train"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./requirements.txt:/app/requirements.txt:ro
      - ./scripts:/app/scripts:ro
    # Silver + Gold only (assumes bronze already exists)
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir -r /app/requirements.txt
        && pip install --no-cache-dir ./pipeline[train]
        && python scripts/silver/clean_dwd_daten.py
        && python scripts/silver/create_messungen_complete.py
        && python scripts/gold/data_full.py
        && python scripts/gold/create_masterdata.py
        && ni-ai-pipeline gold-daily-dataset
        && ni-ai-pipeline stuttgart-weather-hourly
        && if [ ! -f /app/data/gold/datasets/ecoli_model.pkl ] || [ ! -f /app/data/gold/datasets/ecoli_model_metadata.json ]; then ni-ai-pipeline train-ecoli; fi
        && ni-ai-pipeline predict-daily
